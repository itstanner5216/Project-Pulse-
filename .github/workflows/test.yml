name: Test Suite

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    paths:
      - 'ProjectPulse/**/*.ts'
      - 'ProjectPulse/**/*.sh'
      - 'ProjectPulse/lib/**'
      - 'ProjectPulse/bin/**'
      - 'ProjectPulse/pulse/**'
      - 'ProjectPulse/tests/**'
      - 'ProjectPulse/package.json'
      - 'ProjectPulse/package-lock.json'
      - '.github/workflows/test.yml'
  
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ProjectPulse/package-lock.json'
      
      - name: Install dependencies
        working-directory: ProjectPulse
        run: npm ci
      
      - name: Run unit tests with coverage
        working-directory: ProjectPulse
        run: npm test -- --run --reporter=verbose --coverage
      
      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ProjectPulse/coverage/
          retention-days: 30
      
      - name: Coverage Summary
        if: always()
        working-directory: ProjectPulse
        run: |
          echo "::group::Coverage Summary"
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json
          else
            echo "Coverage report not found"
          fi
          echo "::endgroup::"
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const coveragePath = path.join(process.env.GITHUB_WORKSPACE, 'ProjectPulse', 'coverage', 'coverage-summary.json');
              
              if (!fs.existsSync(coveragePath)) {
                console.log('Coverage file not found, skipping comment');
                return;
              }
              
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;
              
              const formatPercent = (pct) => `${pct.toFixed(2)}%`;
              
              let comment = '## 📊 Test Coverage Report\n\n';
              comment += '| Metric | Coverage |\n';
              comment += '|--------|----------|\n';
              comment += `| Lines | ${formatPercent(total.lines.pct)} |\n`;
              comment += `| Statements | ${formatPercent(total.statements.pct)} |\n`;
              comment += `| Functions | ${formatPercent(total.functions.pct)} |\n`;
              comment += `| Branches | ${formatPercent(total.branches.pct)} |\n\n`;
              comment += `**Total Coverage:** ${formatPercent(total.lines.pct)}\n\n`;
              comment += '---\n';
              comment += '*Coverage report generated by Vitest*';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting coverage comment:', error.message);
            }

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ProjectPulse/package-lock.json'
      
      - name: Install dependencies
        working-directory: ProjectPulse
        run: npm ci
      
      - name: Build project
        working-directory: ProjectPulse
        run: npm run build
      
      - name: Run smoke tests
        working-directory: ProjectPulse
        run: |
          if [ -f tests/smoke.sh ]; then
            bash tests/smoke.sh
          else
            echo "No smoke tests found, skipping"
          fi
      
      - name: Run integration test script
        working-directory: ProjectPulse
        run: |
          if [ -f tests/run_tests.sh ]; then
            bash tests/run_tests.sh
          else
            echo "No integration test script found, skipping"
          fi
      
      - name: Report Integration Test Results
        if: always()
        run: |
          echo "::group::Integration Test Summary"
          echo "Integration tests completed"
          echo "::endgroup::"
