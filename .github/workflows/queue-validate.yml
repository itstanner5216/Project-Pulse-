name: Queue Validation

on:
  # Run on PRs that modify the queue file
  pull_request:
    paths:
      - 'agentprompts/QUEUE.yml'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      queue_file:
        description: 'Path to queue file to validate'
        required: false
        default: 'agentprompts/QUEUE.yml'

jobs:
  validate-queue:
    name: Validate Task Queue
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Validate QUEUE.yml
        id: validate
        run: |
          echo "::group::Running queue validation"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.queue_file }}" ]; then
            python scripts/validate_queue.py "${{ github.event.inputs.queue_file }}"
          else
            python scripts/validate_queue.py
          fi
          echo "::endgroup::"
      
      - name: Print queue summary
        if: success()
        run: |
          echo "::group::Queue Summary"
          python -c "
          import yaml
          from pathlib import Path
          
          queue_file = Path('agentprompts/QUEUE.yml')
          with open(queue_file) as f:
              data = yaml.safe_load(f)
          
          print('📋 Task Queue Summary')
          print('=' * 50)
          print(f'Repository: {data.get(\"metadata\", {}).get(\"repo\", \"N/A\")}')
          print(f'Base Branch: {data.get(\"metadata\", {}).get(\"base_branch\", \"N/A\")}')
          print(f'Version: {data.get(\"metadata\", {}).get(\"version\", \"N/A\")}')
          print(f'Created: {data.get(\"metadata\", {}).get(\"created_at\", \"N/A\")}')
          print()
          
          if 'summary' in data:
              summary = data['summary']
              print(f'Total Tasks: {summary.get(\"total_tasks\", 0)}')
              print(f'Phases: {summary.get(\"phases\", 0)}')
              print(f'Estimated Hours: {summary.get(\"estimated_total_hours\", 0)}')
              print()
              
              if 'status_counts' in summary:
                  counts = summary['status_counts']
                  print('Status Breakdown:')
                  print(f'  ✓ Done: {counts.get(\"done\", 0)}')
                  print(f'  ⏳ Doing: {counts.get(\"doing\", 0)}')
                  print(f'  ☐ Todo: {counts.get(\"todo\", 0)}')
                  print(f'  🚫 Blocked: {counts.get(\"blocked\", 0)}')
          
          print()
          print('Phases:')
          if 'phases' in data:
              for i, phase in enumerate(data['phases'], 1):
                  name = phase.get('name', f'Phase {i}')
                  task_count = len(phase.get('tasks', []))
                  print(f'  {i}. {name}: {task_count} tasks')
          "
          echo "::endgroup::"
      
      - name: Check for blocked tasks
        if: success()
        run: |
          echo "::group::Blocked Tasks Check"
          python -c "
          import yaml
          from pathlib import Path
          
          queue_file = Path('agentprompts/QUEUE.yml')
          with open(queue_file) as f:
              data = yaml.safe_load(f)
          
          blocked_tasks = []
          if 'phases' in data:
              for phase in data['phases']:
                  if 'tasks' in phase:
                      for task in phase['tasks']:
                          if task.get('status') == 'blocked':
                              blocked_tasks.append({
                                  'id': task.get('id'),
                                  'title': task.get('title'),
                                  'reason': task.get('blocked_reason', 'No reason provided')
                              })
          
          if blocked_tasks:
              print('⚠️  Blocked Tasks Found:')
              print()
              for task in blocked_tasks:
                  print(f'  • {task[\"id\"]}: {task[\"title\"]}')
                  print(f'    Reason: {task[\"reason\"]}')
                  print()
          else:
              print('✅ No blocked tasks')
          "
          echo "::endgroup::"
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            
            // Read queue file
            const queueData = yaml.load(fs.readFileSync('agentprompts/QUEUE.yml', 'utf8'));
            const summary = queueData.summary || {};
            const statusCounts = summary.status_counts || {};
            
            // Build comment
            let comment = '## ✅ Queue Validation Passed\n\n';
            comment += '### Summary\n\n';
            comment += `- **Total Tasks:** ${summary.total_tasks || 0}\n`;
            comment += `- **Phases:** ${summary.phases || 0}\n`;
            comment += `- **Estimated Hours:** ${summary.estimated_total_hours || 0}\n\n`;
            comment += '### Status Breakdown\n\n';
            comment += `- ✓ Done: ${statusCounts.done || 0}\n`;
            comment += `- ⏳ Doing: ${statusCounts.doing || 0}\n`;
            comment += `- ☐ Todo: ${statusCounts.todo || 0}\n`;
            comment += `- 🚫 Blocked: ${statusCounts.blocked || 0}\n\n`;
            
            // Check for blocked tasks
            let blockedTasks = [];
            if (queueData.phases) {
              for (const phase of queueData.phases) {
                if (phase.tasks) {
                  for (const task of phase.tasks) {
                    if (task.status === 'blocked') {
                      blockedTasks.push(task);
                    }
                  }
                }
              }
            }
            
            if (blockedTasks.length > 0) {
              comment += '### ⚠️ Blocked Tasks\n\n';
              for (const task of blockedTasks) {
                comment += `- **${task.id}**: ${task.title}\n`;
                comment += `  - Reason: ${task.blocked_reason || 'Not specified'}\n`;
              }
              comment += '\n';
            }
            
            comment += '---\n';
            comment += '*Validation performed by queue-validate workflow*';
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if validation failed
        if: failure()
        run: |
          echo "::error::Queue validation failed. Please check the errors above and fix QUEUE.yml"
          exit 1
