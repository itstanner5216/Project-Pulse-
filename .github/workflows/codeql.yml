name: CodeQL Security Analysis

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - 'copilot/**'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config: |
            paths:
              - ProjectPulse/src
            paths-ignore:
              - ProjectPulse/node_modules
              - ProjectPulse/dist
              - ProjectPulse/tests
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ProjectPulse/package-lock.json'
      
      - name: Install dependencies
        working-directory: ProjectPulse
        run: npm ci
      
      - name: Build project
        working-directory: ProjectPulse
        run: npm run build
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
      
      - name: Report CodeQL Results
        if: always()
        run: |
          echo "::group::CodeQL Security Analysis Summary"
          echo "CodeQL analysis completed for ${{ matrix.language }}"
          echo "Security and quality queries executed"
          echo "Results uploaded to Security tab"
          echo "::endgroup::"
