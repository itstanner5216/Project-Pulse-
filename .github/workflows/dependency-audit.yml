name: Dependency Audit

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    paths:
      - 'ProjectPulse/package.json'
      - 'ProjectPulse/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ProjectPulse/package-lock.json'
      
      - name: Run npm audit
        working-directory: ProjectPulse
        run: |
          echo "::group::NPM Audit Results"
          npm audit --audit-level=moderate || true
          echo "::endgroup::"
      
      - name: Run npm audit (JSON output)
        id: audit
        working-directory: ProjectPulse
        continue-on-error: true
        run: |
          npm audit --json > audit-results.json || true
          cat audit-results.json
      
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: ProjectPulse/audit-results.json
          retention-days: 30
      
      - name: Check for critical vulnerabilities
        working-directory: ProjectPulse
        run: |
          echo "::group::Vulnerability Check"
          # Fail on high or critical vulnerabilities
          if npm audit --audit-level=high 2>&1 | grep -q "found [1-9]"; then
            echo "::error::High or critical vulnerabilities found!"
            npm audit --audit-level=high
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found"
          fi
          echo "::endgroup::"
      
      - name: Comment audit results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const auditPath = path.join(process.env.GITHUB_WORKSPACE, 'ProjectPulse', 'audit-results.json');
              
              if (!fs.existsSync(auditPath)) {
                console.log('Audit results file not found, skipping comment');
                return;
              }
              
              const auditData = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
              const metadata = auditData.metadata || {};
              const vulnerabilities = metadata.vulnerabilities || {};
              
              let comment = '## 🔒 NPM Security Audit Report\n\n';
              comment += '| Severity | Count |\n';
              comment += '|----------|-------|\n';
              comment += `| Critical | ${vulnerabilities.critical || 0} |\n`;
              comment += `| High | ${vulnerabilities.high || 0} |\n`;
              comment += `| Moderate | ${vulnerabilities.moderate || 0} |\n`;
              comment += `| Low | ${vulnerabilities.low || 0} |\n`;
              comment += `| Info | ${vulnerabilities.info || 0} |\n\n`;
              
              const total = (vulnerabilities.critical || 0) + 
                           (vulnerabilities.high || 0) + 
                           (vulnerabilities.moderate || 0) + 
                           (vulnerabilities.low || 0);
              
              if (total === 0) {
                comment += '✅ **No vulnerabilities found**\n\n';
              } else if ((vulnerabilities.critical || 0) > 0 || (vulnerabilities.high || 0) > 0) {
                comment += '⚠️ **Action Required:** High or critical vulnerabilities detected\n\n';
              } else {
                comment += '⚠️ **Moderate or low vulnerabilities detected**\n\n';
              }
              
              comment += '---\n';
              comment += '*Audit performed by npm audit*';
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting audit comment:', error.message);
            }

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ProjectPulse/package-lock.json'
      
      - name: Install dependencies
        working-directory: ProjectPulse
        run: npm ci
      
      - name: Check licenses
        working-directory: ProjectPulse
        run: |
          echo "::group::License Information"
          npx license-checker --summary || echo "license-checker not available"
          echo "::endgroup::"
      
      - name: Report License Check Results
        if: always()
        run: |
          echo "::group::License Check Summary"
          echo "License compliance check completed"
          echo "::endgroup::"
