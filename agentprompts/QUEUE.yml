# Sequential Copilot Agent Task Queue
# This file defines the canonical ordered queue of tasks for Project Pulse improvements
# Each task should be executed sequentially by a human operator using GitHub Copilot Agent

metadata:
  version: "1.0.0"
  created_at: "2026-01-27"
  repo: "itstanner5216/Project-Pulse-"
  base_branch: "main"
  description: "Task queue for addressing code review findings and follow-up improvements"
  sources:
    - "CODE_REVIEW_FINDINGS.md"
    - "FOLLOWUP_TASKS.md"
    - "REVIEW_SUMMARY.md"
    - "CONTRIBUTING.md"
    - "SECURITY.md"

# Task Queue organized by phases
# Each task must be completed before moving to the next

phases:
  - name: "Critical Security Fixes"
    description: "Immediate security vulnerabilities that must be addressed first"
    tasks:
      - id: "SEC-001"
        title: "Add workingDir Path Validation"
        description: |
          Add validation for the workingDir parameter before using it as the current working 
          directory for spawning subprocesses. This prevents potential security vulnerabilities 
          from malicious or corrupted delegation requests.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#1-missing-validation-of-workingdir-path"
          - "FOLLOWUP_TASKS.md#task-1-add-workingdir-path-validation"
        status: "done"
        acceptance_criteria:
          - "Create a validateWorkingDir() function that resolves path to absolute form"
          - "Verify path exists and is a directory"
          - "Prevent execution in sensitive system directories (/root, /etc, /sys, /proc, /dev)"
          - "Apply validation in spawnAgent() before spawning subprocess"
          - "Apply validation in loadAgentPrompt() before reading files"
          - "Add error handling with descriptive messages"
          - "Add unit tests for validation function with edge cases"
        suggested_commit_message: "sec: add workingDir path validation to prevent arbitrary code execution"
        labels:
          - "security"
          - "critical"
          - "spawner"
        owners: []
        estimated_hours: 3

  - name: "High Priority Data Integrity"
    description: "Data corruption and concurrency issues"
    tasks:
      - id: "INT-001"
        title: "Fix ID Collision in Delegation Requests"
        description: |
          Replace the collision-prone generateId() with the existing generateUniqueId() function, 
          or implement collision detection with retry logic to prevent silent data corruption.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#2-id-collision-vulnerability-in-request-creation"
          - "FOLLOWUP_TASKS.md#task-2-fix-id-collision-in-delegation-requests"
        status: "todo"
        acceptance_criteria:
          - "Update createRequest() to use generateUniqueId() instead of generateId()"
          - "OR implement collision detection with atomic file creation (wx flag)"
          - "Add retry logic (max 10 attempts) if using collision detection"
          - "Add unit tests to verify uniqueness"
          - "Add integration test that creates 1000+ concurrent requests"
          - "Update documentation to explain ID format"
        suggested_commit_message: "fix: prevent ID collision in delegation requests using generateUniqueId"
        labels:
          - "bug"
          - "high-priority"
          - "data-integrity"
        owners: []
        estimated_hours: 2

      - id: "INT-002"
        title: "Fix Daemon Race Condition on Start"
        description: |
          Use atomic file creation for the PID file to prevent race conditions when multiple 
          processes try to start the daemon simultaneously.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#3-race-condition-in-daemon-start"
          - "FOLLOWUP_TASKS.md#task-3-fix-daemon-race-condition-on-start"
        status: "done"
        acceptance_criteria:
          - "Modify writePid() to use fs.open() with 'wx' flag (exclusive create)"
          - "Return boolean indicating success/failure"
          - "Update startDaemon() to check result of writePid()"
          - "Remove separate isRunning() check before writePid()"
          - "Add unit tests for concurrent start attempts"
          - "Add integration test that starts daemon from multiple processes"
          - "Document the atomic locking mechanism"
        suggested_commit_message: "fix: prevent daemon race condition using atomic PID file creation"
        labels:
          - "bug"
          - "high-priority"
          - "concurrency"
        owners: []
        estimated_hours: 2

  - name: "Resource Management"
    description: "Resource leaks and cleanup issues"
    tasks:
      - id: "RES-001"
        title: "Clear Force-Kill Timer on Process Exit"
        description: |
          Store the force-kill timer and clear it when the subprocess exits to prevent 
          timer leaks that keep the event loop alive.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#4-unhandled-force-kill-timer-leak"
          - "FOLLOWUP_TASKS.md#task-4-clear-force-kill-timer-on-process-exit"
        status: "todo"
        acceptance_criteria:
          - "Add variable to store force-kill timer handle"
          - "Clear force-kill timer in process 'close' handler"
          - "Clear force-kill timer in process 'error' handler"
          - "Add unit test to verify timer is cleared"
          - "Add test to verify event loop can exit cleanly"
        suggested_commit_message: "fix: clear force-kill timer to prevent resource leak"
        labels:
          - "bug"
          - "medium-priority"
          - "resource-management"
        owners: []
        estimated_hours: 1

      - id: "RES-002"
        title: "Close Watcher Before Polling Fallback"
        description: |
          Properly close the file watcher instance when falling back to polling mode 
          to prevent resource leaks.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#5-watcher-falls-back-to-polling-without-cleanup"
          - "FOLLOWUP_TASKS.md#task-5-close-watcher-before-polling-fallback"
        status: "todo"
        acceptance_criteria:
          - "Close watcher in error handler before calling startPolling()"
          - "Set watcher to null after closing"
          - "Add try-catch around watcher.close() to handle close errors"
          - "Add unit test for error handling"
          - "Add test to verify no duplicate processing (watcher + polling)"
        suggested_commit_message: "fix: close file watcher before polling fallback to prevent resource leak"
        labels:
          - "bug"
          - "medium-priority"
          - "resource-management"
        owners: []
        estimated_hours: 1

  - name: "Input Validation"
    description: "Runtime validation and type safety improvements"
    tasks:
      - id: "VAL-001"
        title: "Validate Agent Type at Runtime"
        description: |
          Add runtime validation to ensure agent types are valid before attempting 
          to load agent prompt files.
        source_refs:
          - "CODE_REVIEW_FINDINGS.md#6-no-validation-of-agent-type-at-runtime"
          - "FOLLOWUP_TASKS.md#task-6-validate-agent-type-at-runtime"
        status: "todo"
        acceptance_criteria:
          - "Add validation at start of loadAgentPrompt() function"
