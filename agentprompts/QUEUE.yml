        source_refs:
          - "CODE_REVIEW_FINDINGS.md#7-process-kill-check-can-give-false-negatives"
          - "FOLLOWUP_TASKS.md#task-7-improve-process-existence-check"
        status: "todo"
        acceptance_criteria:
          - "Check error code in isRunning() catch block"
          - "Handle ESRCH: remove PID file, return false"
          - "Handle EPERM: keep PID file, return true"
          - "Handle other errors: remove PID file, return false"
          - "Add unit tests for each error code"
          - "Update documentation about multi-user scenarios"
        suggested_commit_message: "fix: improve process existence check to handle permission errors"
        labels:
          - "bug"
          - "low-priority"
          - "edge-case"
        owners: []
        estimated_hours: 1

  - name: "Testing Infrastructure"
    description: "Add comprehensive test coverage"
    tasks:
