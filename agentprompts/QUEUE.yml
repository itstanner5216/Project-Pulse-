          - "List valid agent types in error message"
          - "Create isValidAgentType() type guard function (optional)"
          - "Add unit tests for invalid agent types"
          - "Update documentation with list of valid agent types"
        suggested_commit_message: "fix: add runtime validation for agent types"
        labels:
          - "bug"
          - "medium-priority"
          - "validation"
        owners: []
        estimated_hours: 1

  - name: "Edge Cases and Quality"
    description: "Edge case handling and code quality improvements"
    tasks:
      - id: "QUA-001"
        title: "Improve Process Existence Check"
        description: |
          Differentiate between 'process doesn't exist' (ESRCH) and 'permission denied' (EPERM) 
